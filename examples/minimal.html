<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LonelySky Engine · minimal embed</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%238caac2'/%3E%3C/svg%3E">
    <style>
      html,body,#universe{width:100%;height:100%;margin:0;background:#020409}
      a{position:fixed;bottom:20px;left:24px;color:#d7e7f3;font:14px system-ui;text-underline-offset:4px}
      #error{position:fixed;inset:24px;color:#f1c7b4;font:16px system-ui;pointer-events:none}
    </style>
    <script type="importmap">
      {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
    </script>
  </head>
  <body>
    <main id="universe"></main>
    <a href="https://lonelysky.app/" target="_blank" rel="noopener">Play LonelySky — the full game ↗</a>
    <p id="error" role="alert"></p>
    <script type="module">
      import { createUniverse } from '../src/index.js';
      import { createUniverseView } from '../src/three.js';

      try {
        const universe = createUniverse({ seed: 'first-light' });
        const view = createUniverseView(document.querySelector('#universe'), { universe });
        view.start();
        // These handles are useful while following the API documentation.
        window.universe = universe;
        window.universeView = view;
        window.addEventListener('pagehide', () => view.dispose(), { once: true });
      } catch (error) {
        document.querySelector('#error').textContent = `Unable to start the universe: ${error.message}`;
        throw error;
      }
    </script>
  </body>
</html>
